name: Documentation

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:

# Allow deploydocs to push to the gh-pages branch using the built-in token.
permissions:
  contents: write
  pull-requests: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install documentation dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # authentication for deploydocs
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # optional SSH key, if configured
        run: julia --project=docs docs/make.jl
